version: "3.8"

networks:
  pipeline-network:
    driver: bridge

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    networks:
      - pipeline-network
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    networks:
      - pipeline-network
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  producer:
    build:
      context: .
      dockerfile: Dockerfile.producer
    container_name: producer
    networks:
      - pipeline-network
    depends_on:
      - kafka
    restart: on-failure

  spark:
    image: apache/spark:3.5.0
    container_name: spark
    networks:
      - pipeline-network
    depends_on:
      - kafka
    volumes:
      - ./spark:/app/spark
      - spark-ivy-cache:/root/.ivy2
    working_dir: /app
    user: root
    command: sleep infinity

  postgres:                                        # ← inside services
    image: postgres:15
    container_name: postgres
    networks:
      - pipeline-network
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: economy_db
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:                                           # ← one volumes block at the end
  spark-ivy-cache:
  postgres-data:

env_file:
  - .env